version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 6
    groups:
      # 只含 patch 的组：update-type 会被判定为 semver-patch，可被自动合并工作流放行
      npm-patch:
        update-types:
          - patch
      # 含 minor 的组：始终走人工审核
      npm-minor:
        update-types:
          - minor
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-patch:
        update-types:
          - patch
      actions-minor:
        update-types:
          - minor
