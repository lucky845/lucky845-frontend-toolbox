name: Dependabot auto-merge

# 只自动合并 patch 级更新（dependabot.yml 里 npm-patch / actions-patch 两个组）。
# minor 及以上一律留人工审核。
on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # 双重护栏：只处理 Dependabot 开的 PR，且只在本仓库内生效
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'lucky845/lucky845-frontend-toolbox'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          # 必须用 PAT：GITHUB_TOKEN 合并产生的 push 不会触发 deploy.yml，会出现
          # 「PR 合并成功但线上没更新」。因此这里不回退——缺失就直接失败，宁可不合并。
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          # 未 checkout 时 gh 无法从 .git 推断仓库，显式指定避免 "not a git repository"
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          echo "update-type=${{ steps.metadata.outputs.update-type }}"
          echo "dependency-group=${{ steps.metadata.outputs.dependency-group }}"
          echo "dependency-names=${{ steps.metadata.outputs.dependency-names }}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::AUTOMERGE_PAT 未配置。用 GITHUB_TOKEN 合并不会触发部署，故中止。"
            exit 1
          fi

          # 正常情况下 build 还在跑，PR 不可立即合并，--auto 会把合并排进队列。
          # 但若 build 恰好已经绿灯，GitHub 会拒绝 "Pull request is in clean status"，
          # 此时直接合并即可（检查已通过，风险等价）。
          if ! gh pr merge --auto --squash "$PR_URL" 2>/tmp/merge-err.txt; then
            if grep -qiE "clean status|already (merged|mergeable)" /tmp/merge-err.txt; then
              echo "::notice::PR 已可直接合并，改为立即 squash 合并"
              gh pr merge --squash "$PR_URL"
            else
              cat /tmp/merge-err.txt
              exit 1
            fi
          fi

      - name: Skip auto-merge for minor or major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch'
        run: |
          echo "::notice title=Skipped::${{ steps.metadata.outputs.update-type }} 需要人工审核：${{ steps.metadata.outputs.dependency-names }}"

      - name: Make sure auto-merge is actually armed
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # 记录当前 auto-merge 状态，便于之后排查
          gh pr view "$PR_URL" --json autoMergeRequest,mergeStateStatus,mergeable \
            --jq '{autoMergeRequest, mergeStateStatus, mergeable}'
